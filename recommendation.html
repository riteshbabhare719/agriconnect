<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Recommendation — Smart AgriConnect</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="recommendation">

<nav class="topnav" id="agri-nav"></nav>

<div class="container">
  <div class="page-header text-center">
    <h1><span class="eyebrow-icon">🌱</span>Find the Best Crop for Your Farm</h1>
    <p class="text-muted">Enter your soil and climate details to get a crop suggestion.</p>
  </div>

  <div class="grid grid-2" style="align-items:start;">
    <div class="card">
      <form id="recommendForm">
        <div class="form-group">
          <label for="soilType">Soil Type</label>
          <select id="soilType">
            <option>Loamy</option><option>Clayey</option><option>Sandy Loam</option>
            <option>Black Soil</option><option>Red Soil</option>
          </select>
        </div>
        <div class="grid grid-2" style="gap:16px;">
          <div class="form-group"><label for="nitrogen">Nitrogen (N)</label><input type="number" id="nitrogen" placeholder="e.g. 80"></div>
          <div class="form-group"><label for="phosphorus">Phosphorus (P)</label><input type="number" id="phosphorus" placeholder="e.g. 40"></div>
        </div>
        <div class="grid grid-2" style="gap:16px;">
          <div class="form-group"><label for="potassium">Potassium (K)</label><input type="number" id="potassium" placeholder="e.g. 40"></div>
          <div class="form-group"><label for="temperature">Temperature (°C)</label><input type="number" id="temperature" placeholder="e.g. 28"></div>
        </div>
        <div class="grid grid-2" style="gap:16px;">
          <div class="form-group"><label for="humidity">Humidity (%)</label><input type="number" id="humidity" placeholder="e.g. 65"></div>
          <div class="form-group"><label for="rainfall">Rainfall (mm)</label><input type="number" id="rainfall" placeholder="e.g. 120"></div>
        </div>
        <div class="form-group">
          <label for="soilPh">Soil pH</label>
          <input type="number" step="0.1" id="soilPh" placeholder="e.g. 6.5">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Get Recommendation</button>
      </form>
    </div>

    <div id="recommendResult" style="display:none;"></div>
  </div>
</div>

<footer class="site-footer" id="agri-footer"></footer>

<script src="js/main.js"></script>
<script src="js/recommendation.js"></script>
</body>
</html>
